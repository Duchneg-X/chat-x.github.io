<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot Hub</title>
  <link rel="stylesheet" href="Css/Main.css" />
</head>
<body>

  <!-- AUTHENTICATION OVERLAY -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="authTitle">Sign In</h2>
      <form id="authForm">
        <div class="form-group" id="usernameGroup" style="display: none;">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label for="email">Gmail / Email</label>
          <input type="email" id="email" required placeholder="name@gmail.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" id="authSubmitBtn" class="primary-btn">Sign In</button>
      </form>
      <p class="toggle-text">
        <span id="authToggleMsg">Don't have an account?</span>
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
    </div>
  </div>

  <!-- MAIN APP INTERFACE -->
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Chats</h3>
        <button id="newChatBtn" class="icon-btn" title="New Chat">+</button>
      </div>
      <div class="user-badge" id="userBadge">
        <span class="user-id" id="displayUserId">ID: Loading...</span>
        <span class="user-name" id="displayUsername">Guest</span>
      </div>
      <ul class="chat-list" id="chatList"></ul>
      <button id="logoutBtn" class="logout-btn">Sign Out</button>
    </aside>

    <!-- CHAT WORKSPACE -->
    <main class="chat-workspace">
      <header class="chat-header">
        <button id="toggleSidebar" class="icon-btn">☰</button>
        <h2>Assistant Bot</h2>
      </header>

      <div class="message-container" id="messageContainer">
        <div class="message bot-message">
          Hello! How can I assist you today?
        </div>
      </div>

      <div class="input-area">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Type your message here..." 
          autocomplete="off" 
        />
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="Js/Main.js"></script>
</body>
</html>
